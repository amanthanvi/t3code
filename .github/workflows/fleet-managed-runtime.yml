name: Aman managed Linux runtime

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Published upstream nightly (empty builds oldest missing release)
        required: false
        type: string

# One immutable release at a time; never cancel a publishing job.
concurrency:
  group: aman-managed-runtime
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'amanthanvi/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/fleet-managed
          sparse-checkout-cone-mode: true

      - name: Test publisher contracts
        run: python3 -B -m unittest discover -s scripts/fleet-managed -p 'test_*.py' -v

      - name: Select published upstream and resolve patch SHA once
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_VERSION" ]]; then args+=(--version "$REQUESTED_VERSION"); fi
          python3 -B scripts/fleet-managed/release.py select --output "$RUNNER_TEMP/selection.json" "${args[@]}"

      - name: Prepare exact source; refuse patch conflicts
        if: steps.select.outputs.version != ''
        run: |
          python3 -B scripts/fleet-managed/release.py prepare \
            --selection "$RUNNER_TEMP/selection.json" \
            --source "$GITHUB_WORKSPACE/prepared" --context "$RUNNER_TEMP/context.json"

      - name: Set up exact source Node and Vite+ toolchain
        if: steps.select.outputs.version != ''
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          working-directory: prepared
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install verified source dependencies
        if: steps.select.outputs.version != ''
        working-directory: prepared
        # Knip loads every workspace config, including Mobile's notice generator.
        # A complete frozen install is required for the unchanged source checker.
        run: vp install --frozen-lockfile

      - name: Align compatibility version and seal inspectable source
        if: steps.select.outputs.version != ''
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          cd prepared
          node scripts/update-release-package-versions.ts "$VERSION"
          # Public production Connect/Clerk build inputs only, never a host's .env.
          test -f .env.example
          cp .env.example .env
          cd ..
          manifest=$(python3 -B scripts/fleet-managed/release.py seal --source prepared --context "$RUNNER_TEMP/context.json")
          echo "T3CODE_BUILD_PROVENANCE=$manifest" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/context.json"))["sourceDateEpoch"])')" >> "$GITHUB_ENV"

      - name: Required unchanged source checker and regression coverage
        if: steps.select.outputs.version != ''
        working-directory: prepared
        run: |
          set -euo pipefail
          tests=(
            apps/server/src/serviceLauncher.test.ts
            apps/server/src/serverRuntimeState.test.ts
            apps/server/src/serverOwnershipLock.test.ts
            apps/server/src/cloud/serviceHandoff.test.ts
            apps/server/src/cloud/serviceLauncherClient.test.ts
            apps/server/src/cloud/pinnedRuntime.test.ts
            apps/server/src/cloud/bootService.test.ts
            apps/server/src/cloud/selfUpdate.test.ts
            apps/server/src/cli/update.test.ts
            apps/server/src/cli/uninstall.test.ts
          )
          upstream_commit=$(python3 - <<'PY'
          import json, os, re
          with open(os.path.join(os.environ["RUNNER_TEMP"], "context.json")) as source:
              commit = json.load(source)["upstreamSourceCommit"]
          assert re.fullmatch(r"[a-f0-9]{40}", commit), "invalid upstream commit"
          print(commit)
          PY
          )
          changed_tests=$(git diff --name-only "$upstream_commit" HEAD -- "${tests[@]}")
          for file in "${tests[@]}"; do
            test -f "$file"
            if [[ $'\n'"$changed_tests"$'\n' != *$'\n'"$file"$'\n'* ]]; then
              echo "Required regression is not selected by check:changed: $file" >&2
              exit 1
            fi
          done
          # Changed *.test.ts files are selected by the source checker's normal test pass;
          # it also checks formatting, lint, both Knip passes and affected typechecks.
          vp run check:changed "$upstream_commit" --concurrency 1

      - name: Install native packaging prerequisites
        if: steps.select.outputs.version != ''
        run: sudo apt-get update && sudo apt-get install -y patchelf libsecret-1-dev pkg-config

      - name: Build complete Linux x64 native runtime
        if: steps.select.outputs.version != ''
        working-directory: prepared
        env:
          # A managed source build never reports official telemetry provenance.
          T3CODE_TELEMETRY_CHANNEL: dev
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          vp run --filter t3 build
          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"

      - name: Validate archive provenance and assemble immutable assets
        if: steps.select.outputs.version != ''
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          python3 -B scripts/fleet-managed/release.py package --context "$RUNNER_TEMP/context.json" \
            --archive "prepared/release-cli/t3-$VERSION-linux-x64.tar.gz" --output "$RUNNER_TEMP/managed-release" --source prepared

      - name: Retain verified candidate before publication
        if: steps.select.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: managed-linux-x64-${{ steps.select.outputs.version }}
          path: ${{ runner.temp }}/managed-release
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact source assets and immutable managed release
        if: steps.select.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AMAN_MANAGED_IMMUTABILITY_VERIFIED: ${{ vars.AMAN_MANAGED_IMMUTABILITY_VERIFIED }}
        run: |
          python3 -B scripts/fleet-managed/release.py publish \
            --directory "$RUNNER_TEMP/managed-release" --source prepared
